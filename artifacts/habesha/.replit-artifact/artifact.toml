kind = "web"
previewPath = "/"
title = "Jima"
description = "Jima restaurant operations frontend for CARAVAN Lounge, powered by Idata Technologies, with role-based dashboards for admin, owner, manager, waiter, chef, cashier, and storekeeper."
version = "1.0.0"
id = "artifacts/habesha"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25335

[services.development]
run = "pnpm --filter @workspace/nextjs-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nextjs-app", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/nextjs-app", "run", "start" ]

[services.production.run.env]
PORT = "25335"
NODE_ENV = "production"

[services.env]
PORT = "25335"
BASE_PATH = "/"

[[services]]
name = "backend"
paths = [ "/nestjs-backend" ]
localPort = 3001

[services.development]
run = "pnpm --filter @workspace/nestjs-server run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nestjs-server", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/nestjs-server", "run", "start" ]

[services.production.run.env]
PORT = "3001"
NODE_ENV = "production"

[services.env]
PORT = "3001"